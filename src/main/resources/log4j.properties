# Imposta tutti i log a FATAL (solo errori gravi)
log4j.rootLogger=FATAL, stdout

# Configurazione console
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=%d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n

# Disabilita completamente i log di Spark e Hadoop
log4j.logger.org.apache.spark=OFF
log4j.logger.org.apache.hadoop=OFF
log4j.logger.org.spark_project=OFF
log4j.logger.io.netty=OFF
log4j.logger.org.eclipse.jetty=OFF
log4j.logger.akka=OFF